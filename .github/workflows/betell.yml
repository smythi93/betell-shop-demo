name: betell
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests
      - uses: smythi93/BeTell@v0.1.1
        with:
          pytest-args: tests
